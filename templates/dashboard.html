{% extends "layout.html" %}
{% block content %}

<style>
.dashboard-box {
  padding: 30px;
  background-color: #E6E6FA;
  border-radius: 10px;
  margin-top: 20px;
}

.dashboard-header {
  text-align: center;
}

.dashboard-header h2 {
  font-size: 40px;
  margin-bottom: 20px;
}

.dashboard-actions {
  text-align: center;
  margin-bottom: 20px;
}

.dashboard-actions button {
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
}

#customers {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

#customers td, #customers th {
  border: 1px solid #ddd;
  padding: 10px;
}

#customers tr:nth-child(even) {
  background-color: #f9f9f9;
}

#customers tr:hover {
  background-color: #ddd;
}

#customers th {
  background-color: #04AA6D;
  color: white;
  text-align: left;
}

#customers td:nth-child(2) {
  max-width: 400px;
  word-wrap: break-word;
}
</style>

<div class="dashboard-box">

    <div class="dashboard-header">
        <h2>Admin Dashboard</h2>
    </div>

    <div class="dashboard-actions">
        <a href="{{ url_for('edit', id='0') }}"><button>Add New Blog</button></a>
        <!-- <a href="{{ url_for('logout') }}"><button>Logout</button></a> -->
    </div>

    <div style="overflow-x:auto;">
        <table id="customers">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>View</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>

            {% for post in posts %}
            <tr>
                <td>{{ post.id }}</td>
                <td>{{ post.title }}</td>
                <td>{{ post.date }}</td>

                <td>
                    <a href="{{ url_for('blogs_route', post_slug=post.slug) }}">
                        <button>View</button>
                    </a>
                </td>

                <td>
                    <a href="{{ url_for('edit', id=post.id) }}">
                        <button>Edit</button>
                    </a>
                </td>

                <td>
                    <a href="{{ url_for('delete', id=post.id) }}">
                        <button>Delete</button>
                    </a>
                </td>
            </tr>
            {% endfor %}

        </table>
    </div>

</div>

{% endblock %}
